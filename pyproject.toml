[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "draw-cli"
# Single source of truth: the version lives in draw_cli.__version__ and is resolved
# here at build time (see [tool.setuptools.dynamic] below), so it can never drift
# between the package and the dist metadata.
dynamic = ["version"]
description = "Text-to-image via APIs, local Diffusers, native Metal/GGUF, or a ChatGPT subscription through Codex."
requires-python = ">=3.9"
dependencies = ["huggingface_hub>=0.34,<2", "Pillow"]

# Heavy ML packages are opt-in; API-only and sdcpp installs never install PyTorch.
[project.optional-dependencies]
sdcpp = ["psutil>=5.9"]
local = [
    "torch>=2.4",
    "diffusers>=0.35,<1",
    "transformers>=4.44,<5",
    "accelerate>=0.33",
    "safetensors>=0.4.5",
    "sentencepiece>=0.2",
    "protobuf>=3.20",
    "psutil>=5.9",
]

# The CLI is a real package (`draw_cli`), exposed via a proper console entry point
# instead of the deprecated distutils `script-files` shebang-rewrite (which pipx never
# installed correctly). pipx installs `draw = draw_cli.cli:main` from the wheel into an
# isolated venv that satisfies huggingface_hub + Pillow, and never touches bin/draw.
# The legacy install.sh SYMLINK path keeps working: bin/draw is a thin shim that resolves
# the symlink to the repo root and imports draw_cli.
[project.scripts]
draw = "draw_cli.cli:main"

# Explicit package list (NOT setuptools flat-layout autodiscovery, which would silently
# pull stray top-level dirs like bin/ into the wheel).
[tool.setuptools.packages.find]
include = ["draw_cli*"]

# Resolve the dynamic [project] version from draw_cli.__version__ at build time.
[tool.setuptools.dynamic]
version = { attr = "draw_cli.__version__" }
